<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfa">
  <meta name="description" content="kuangrad's trained network, running in your browser: draw a digit and watch it guess, next to the loss curve from its training run.">
  <title>kuangrad results · Kuan Yi Wang</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./results.css">
  <script type="module" src="./results.js"></script>
</head>
<body class="results-page">
  <a class="skip-link" href="#reader">Skip to the training run</a>
  <main class="workspace">
    <section class="visual" aria-label="Draw a digit for the trained network">
      <div class="visual-head"><span class="wordmark">kuangrad <span>· the trained network</span></span><button type="button" id="clear" class="pad-clear">Clear</button></div>
      <div class="pad-area">
        <div class="pad-wrap">
          <canvas id="pad" width="512" height="512" aria-label="16 by 16 drawing grid" role="img"></canvas>
          <p class="pad-hint">Draw a digit. Right-click or hold shift to erase.</p>
        </div>
        <div class="guess" aria-live="polite">
          <p class="guess-digit" id="guess-digit">?</p>
          <p class="guess-note" id="guess-note">Loading the weights…</p>
          <ol class="probs" id="probs"></ol>
        </div>
      </div>
    </section>
    <aside class="notes" aria-label="kuangrad results">
      <div class="reading-nav">
        <nav class="page-tabs" aria-label="Write-up sections"><a href="./">Write-up</a><a href="results.html" aria-current="page">Results</a></nav>
      </div>
      <div class="reader" id="reader" tabindex="0" aria-label="The training run">
        <article id="article">
          <section class="reading-block">
            <h2>Results</h2>
            <p id="summary"></p>
            <figure class="loss-figure">
              <div id="loss" class="loss-chart"></div>
              <figcaption><span class="key key-raw"></span>loss on each step’s one drawing <span class="key key-avg"></span>average of the last 100 steps</figcaption>
            </figure>
            <p class="results-note" id="note"></p>
          </section>
        </article>
      </div>
    </aside>
  </main>
  <footer class="site-footer">Made by <a href="https://www.kuant.space" target="_blank" rel="noopener">Kuan Yi Wang</a> with <span role="img" aria-label="love">❤️</span></footer>
  <noscript><div class="no-script">The drawing pad needs JavaScript. The code is on <a href="https://github.com/AcastaPaloma/kuangrad">GitHub</a>.</div></noscript>
</body>
</html>
